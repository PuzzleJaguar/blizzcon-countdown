    .page {
      width: min(1100px, calc(100% - 32px));
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 0 clamp(22px, 5vh, 42px);
    }

    .countdown-wrap {
      width: 100%;
      text-align: center;
      margin-top: 0;
    }

    .eyebrow {
      margin: 0 0 14px;
      font-size: clamp(0.72rem, 1.2vw, 0.9rem);
      font-weight: 750;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(224, 247, 255, 0.86);
      text-shadow: 0 2px 14px rgba(0,0,0,.8);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: clamp(8px, 1.4vw, 16px);
      width: 100%;
      padding: clamp(12px, 2vw, 20px);
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(7, 27, 47, 0.56), rgba(1, 12, 24, 0.70));
      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px) saturate(130%);
      -webkit-backdrop-filter: blur(10px) saturate(130%);
    }

    .unit {
      min-width: 0;
      padding: clamp(13px, 2vw, 21px) 8px clamp(11px, 1.8vw, 17px);
      border-radius: 15px;
      background: rgba(117, 206, 255, 0.06);
      border: 1px solid rgba(204, 241, 255, 0.09);
    }

    .value {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.3rem, 6.6vw, 5.3rem);
      line-height: 0.92;
      font-weight: 850;
      letter-spacing: -0.055em;
      color: var(--ice-bright);
      text-shadow:
        0 0 10px rgba(119, 220, 255, 0.65),
        0 0 28px rgba(46, 160, 255, 0.35),
        0 3px 8px rgba(0,0,0,.85);
    }

    .label {
      display: block;
      margin-top: clamp(8px, 1.2vw, 13px);
      font-size: clamp(0.63rem, 1.1vw, 0.82rem);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(202, 238, 255, 0.73);
    }

    .date {
      margin: 16px 0 0;
      font-size: clamp(0.78rem, 1.4vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      color: rgba(225, 246, 255, 0.88);
      text-shadow: 0 2px 12px rgba(0,0,0,.75);
    }

    .finished {
      display: none;
      width: 100%;
      padding: 26px 20px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(2, 16, 31, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: white;
      text-shadow: 0 0 22px rgba(107, 218, 255, .75);
    }

    @media (max-width: 640px) {
      body {
        background-position: center top;
      }

      .page {
        width: min(100% - 20px, 560px);
        justify-content: flex-end;
        padding-bottom: 18px;
      }

      .countdown-wrap {
        margin-top: 0;
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
        border-radius: 18px;
      }

      .unit { border-radius: 12px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .countdown-wrap { animation: rise .8s ease-out both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="countdown-wrap" aria-labelledby="countdown-title">
      <p class="eyebrow" id="countdown-title">Countdown to BlizzCon</p>

      <div class="countdown" id="countdown" role="timer" aria-live="off">
        <div class="unit">
          <span class="value" id="days">000</span>
          <span class="label">Days</span>
        </div>
        <div class="unit">
          <span class="value" id="hours">00</span>
          <span class="label">Hours</span>
        </div>
        <div class="unit">
          <span class="value" id="minutes">00</span>
          <span class="label">Minutes</span>
        </div>
        <div class="unit">
          <span class="value" id="seconds">00</span>
          <span class="label">Seconds</span>
        </div>
      </div>

      <div class="finished" id="finished">BLIZZCON IS HERE</div>
      <p class="date">September 12, 2026 · 10:00 AM Pacific</p>
    </section>
  </main>

  <script>
    // September 12, 2026 at 10:00 AM Pacific Daylight Time (UTC-7)
    const target = new Date('2026-09-12T10:00:00-07:00').getTime();

    const els = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds'),
      countdown: document.getElementById('countdown'),
      finished: document.getElementById('finished')
    };

    const pad = (number, size = 2) => String(number).padStart(size, '0');

    function updateCountdown() {
      const remaining = target - Date.now();

      if (remaining <= 0) {
        els.days.textContent = '000';
        els.hours.textContent = '00';
        els.minutes.textContent = '00';
        els.seconds.textContent = '00';
        els.countdown.style.display = 'none';
        els.finished.style.display = 'block';
        return false;
      }

      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      els.days.textContent = pad(days, 3);
      els.hours.textContent = pad(hours);
      els.minutes.textContent = pad(minutes);
      els.seconds.textContent = pad(seconds);
      return true;
    }

    updateCountdown();
    const timer = setInterval(() => {
      if (!updateCountdown()) clearInterval(timer);
    }, 1000);
  </script>
</body>
</html>
